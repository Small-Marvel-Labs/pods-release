name: AppImage
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      revision:
        description: Suffix for re-releasing an already released upstream version (tags are immutable)
        default: ""

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.upstream.outputs.tag }}
      release_tag: ${{ steps.upstream.outputs.release_tag }}
      released: ${{ steps.upstream.outputs.released }}
    steps:
      - id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ inputs.revision }}
        run: |
          api() { curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$1"; }
          tag=$(api marhkb/pods/releases/latest | jq -r .tag_name)
          release_tag="$tag${REVISION:+-$REVISION}"
          released=$(api "$GITHUB_REPOSITORY/releases?per_page=100" | jq --arg tag "$tag" --arg rel "$release_tag" \
            'any(.[]; .tag_name == $rel or ($rel == $tag and (.tag_name | startswith($tag + "-"))))')
          {
            echo "tag=$tag"
            echo "release_tag=$release_tag"
            echo "released=$released"
          } >> "$GITHUB_OUTPUT"
          echo "Upstream $tag, releasing as $release_tag, already released: $released"

  build:
    needs: [check]
    if: ${{ needs.check.outputs.released == 'false' }}
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - runs-on: ubuntu-latest
            arch: x86_64
            container: archlinux:base-devel
          - runs-on: ubuntu-24.04-arm
            arch: aarch64
            # the official archlinux image is x86_64 only
            container: ghcr.io/pkgforge-dev/archlinux:latest
    container: ${{ matrix.container }}
    env:
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up anylinux tools
        env:
          QUICK_SHARUN: https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/c9079a3c4a2af6ff86262dbbd794753aa0c38768/useful-tools/quick-sharun.sh
          DEBLOATED_PACKAGES: https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/c9079a3c4a2af6ff86262dbbd794753aa0c38768/useful-tools/get-debloated-pkgs.sh
          MAKE_AUR_PACKAGE: https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/c9079a3c4a2af6ff86262dbbd794753aa0c38768/useful-tools/make-aur-package.sh
        run: |
          curl -fsSL -o /tmp/setup.sh https://raw.githubusercontent.com/pkgforge-dev/anylinux-setup-action/7278cbb7c3692fce7241d427614ef7984192f138/setup.sh
          echo "da6bcf784b114b651990809dfc0e070180ab82bb0b79d2ba2de46d37f8fa0d2b  /tmp/setup.sh" | sha256sum -c
          sh /tmp/setup.sh
      - run: /bin/sh ./get-dependencies.sh
      - run: /bin/sh ./make-appimage.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AppImage-${{ matrix.arch }}
          path: dist/*.AppImage*

  release:
    if: ${{ github.ref_name == 'main' }}
    needs: [check, build]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: AppImage-*
          merge-multiple: true
          path: dist
      - run: |
          curl -fsS "https://api.github.com/repos/marhkb/pods/releases/tags/$TAG" \
            | jq -r .body \
            | sed -e '/^<?xml/d' -e '/description/d' -e 's#<li>#- #' -e 's#<[^>]*>##g' -e 's/^[[:space:]]*//' \
            > notes.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.check.outputs.release_tag }}
          name: Pods ${{ needs.check.outputs.release_tag }}
          body_path: notes.md
          files: dist/*
          fail_on_unmatched_files: true
          make_latest: true
